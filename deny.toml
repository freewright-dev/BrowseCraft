# Dependency policy: no blanket advisory exceptions. Each ignore below names
# one advisory that is tracked, with its replacement plan, in
# docs/dependencies.md; remove it when the dependency is gone. Everything else,
# including any new advisory, fails `cargo deny check` (run in CI).
[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: unmaintained, build-time only via GTK/glib on Linux/BSD; tracked in docs/dependencies.md" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, via fontdue; tracked in docs/dependencies.md" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "GPL-3.0-or-later",
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "ISC", "Zlib",
    "MPL-2.0", "Unicode-3.0", "CDLA-Permissive-2.0", "Unlicense",
    "OFL-1.1", "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
