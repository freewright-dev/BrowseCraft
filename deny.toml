# Dependency policy: no blanket advisory exceptions. Outstanding maintenance
# and target-specific findings are tracked in docs/dependencies.md.
[advisories]
version = 2
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "GPL-3.0-or-later",
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "ISC", "Zlib",
    "MPL-2.0", "Unicode-3.0", "CDLA-Permissive-2.0", "Unlicense",
    "OFL-1.1", "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
