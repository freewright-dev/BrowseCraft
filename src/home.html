<!doctype html>
<title>New Tab</title>
<style>
  body { margin: 0; background: #f6f7f9; color: #1f2328; font-family: system-ui, sans-serif }
  main { max-width: 560px; margin: 0 auto; padding: 120px 24px 48px }
  h1 { font-size: 44px; font-weight: 600; margin: 0 0 6px; text-align: center; color: #24292f }
  .accent { color: #2f6fde }
  .tagline { text-align: center; color: #57606a; margin: 0 0 32px }
  form { display: flex; gap: 8px }
  input[type=search] {
    flex: 1; font-size: 16px; padding: 10px 14px; border: 1px solid #d0d7de;
    border-radius: 8px; background: white; color: #1f2328
  }
  button {
    font-size: 16px; padding: 10px 18px; border: 0; border-radius: 8px;
    background: #2f6fde; color: white
  }
  .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 40px }
  .links a {
    display: block; padding: 8px 14px; border-radius: 999px; background: white;
    border: 1px solid #d0d7de; color: #24292f; text-decoration: none; font-size: 14px
  }
  footer { text-align: center; color: #8c959f; font-size: 13px; margin-top: 56px }
</style>
<main>
  <h1>Pr<span class="accent">owl</span></h1>
  <p class="tagline">A tiny browser with its own Rust rendering engine.</p>
  <form action="https://www.startpage.com/sp/search" method="get">
    <input type="search" name="query" placeholder="Search Startpage or type an address above" autofocus>
    <button type="submit">Search</button>
  </form>
  <nav class="links">
    <a href="https://news.ycombinator.com/">Hacker News</a>
    <a href="https://en.wikipedia.org/wiki/Special:Random">Random Wikipedia article</a>
    <a href="https://lobste.rs/">Lobsters</a>
    <a href="https://example.com/">example.com</a>
    <a href="https://doc.rust-lang.org/book/">The Rust Book</a>
  </nav>
  <footer>HTML &middot; CSS &middot; layout &middot; painting, all in Rust. No JavaScript.</footer>
</main>
