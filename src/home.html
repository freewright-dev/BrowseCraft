<!doctype html>
<title>New Tab</title>
<style>
  {{CSS}}
  .hero { text-align: center; padding: 48px 0 6px }
  .logo { display: flex; justify-content: center; margin-bottom: 20px }
  h1.name { font-size: 56px; font-weight: 700; margin: 0 0 6px; text-align: center }
  .tagline { text-align: center; color: @muted@; margin: 0 0 30px; font-size: 15px }
  form.search { display: flex; gap: 10px }
  form.search input { flex: 1; font-size: 16px; padding: 13px 18px; border: 1px solid @line@; border-radius: 12px; background: @surface@; color: @text@ }
  form.search button { font-size: 15px; font-weight: 600; padding: 13px 22px; border: 0; border-radius: 12px; background: @accent@; color: #ffffff }
  .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 42px }
  .links a { display: block; padding: 9px 16px; border-radius: 999px; background: @surface@; border: 1px solid @line@; color: @text@; text-decoration: none; font-size: 14px }
  .hint { text-align: center; color: @muted@; font-size: 13px; margin-top: 60px }
</style>
<main>
  <div class="hero">
    <div class="logo"><img src="browsecraft://assets/logo.png" alt="BrowseCraft logo" width="128" height="128"></div>
    <h1 class="name">BrowseCraft</h1>
    <p class="tagline">A small, fast browser with its own Rust rendering engine.</p>
  </div>
  <form class="search" action="https://www.startpage.com/sp/search" method="get">
    <input type="search" name="query" placeholder="Search Startpage or type an address above" autofocus>
    <button type="submit">Search</button>
  </form>
  <nav class="links">{{LINKS}}</nav>
  <p class="hint">Press Ctrl + D to bookmark a page. Press Shift + K for all shortcuts.</p>
</main>
