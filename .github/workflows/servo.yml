name: Servo (experimental)

# Builds the experimental Servo web view (Linux, `--features servo`, issue #65).
# It is not a required check: the default build and tests run in ci.yml.
on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/servo.yml"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 120
    env:
      CC: clang-19
      CXX: clang++-19
      LIBCLANG_PATH: /usr/lib/llvm-19/lib
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang-19 libclang-19-dev llvm-19-dev \
            cmake gperf m4 python3 libssl-dev libdbus-1-dev libudev-dev libunwind-dev liblzma-dev \
            libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri libvulkan1 libfreetype6-dev \
            libharfbuzz-dev libglib2.0-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-0 libxmu-dev xorg-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: servo
      - name: Build with Servo
        run: |
          start=$(date +%s)
          cargo build --locked --features servo
          echo "Build took $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"
          ls -l target/debug/browsecraft >> "$GITHUB_STEP_SUMMARY"
