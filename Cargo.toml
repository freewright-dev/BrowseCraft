[package]
name = "browsecraft"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
arboard = { version = "3", default-features = false }
egui = "0.36.2"
egui-phosphor = "0.14.0"
egui-wgpu = { version = "0.36.2", features = ["winit"] }
egui-winit = "0.36.2"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pollster = "1.0.1"
softbuffer = "0.4"
ureq = "3"
url = "2"
winit = "0.30"
wry = "0.53"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_Com"] }

[dev-dependencies]
flate2 = "1"
