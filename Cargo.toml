[package]
name = "browsecraft"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
arboard = { version = "3", default-features = false }
egui = "0.36.2"
egui-phosphor = "0.14.0"
egui-wgpu = { version = "0.36.2", features = ["winit"] }
egui-winit = "0.36.2"
fontdue = "0.9"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pollster = "1.0.1"
softbuffer = "0.4"
tempfile = "3"
ureq = "3"
url = "2"
keepass = { version = "0.8", default-features = false, features = ["save_kdbx4"] }
argon2 = { package = "rust-argon2", version = "3" }
secstr = "0.5"
zeroize = "1"
base64 = "0.22"
winit = "0.30"
wry = "0.55"
psl = "2"

# Release builds abort on panic, so production code may not unwrap or
# expect; the few proven invariants say why in an `allow` attribute. Tests
# may (clippy.toml). Enforced by `cargo clippy` in CI.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[features]
# Experimental (issue #65): render web pages with Servo on Linux, where there
# is no system web view. Off by default; other platforms ignore it.
servo = ["dep:servo"]

[target.'cfg(target_os = "linux")'.dependencies]
servo = { version = "0.6", optional = true }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_Security_Authorization"] }

[dev-dependencies]
flate2 = "1"
